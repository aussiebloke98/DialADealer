<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OzPosty</title>
<style>html,body{margin:0;background:#050509;color:#f3f1ff;font-family:system-ui,sans-serif;min-height:100%}#s{display:grid;place-items:center;min-height:100dvh;margin:0}</style>
</head>
<body>
<div id="s">Loading OzPosty…</div>
<script src="data.js"></script>
<script>
(async () => {
  try {
    const bin = Uint8Array.from(atob(window.__OZ), c => c.charCodeAt(0));
    const ds = new DecompressionStream("gzip");
    const stream = new Blob([bin]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById("s").textContent = "Could not load OzPosty: " + e;
  }
})();
</script>
</body>
</html>
